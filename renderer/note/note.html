<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghost Note</title>
    <link rel="stylesheet" href="note.css" />
  </head>
  <body>
    <div id="shell" class="shell">
      <header id="chrome" class="chrome" aria-label="Note controls">
        <div class="chrome-left">
          <span class="ghost-mark" title="Ghost Notetaker">◈</span>
          <input
            id="title"
            class="title-input"
            type="text"
            maxlength="120"
            placeholder="Title"
            spellcheck="false"
            aria-label="Note title"
          />
        </div>
        <div class="chrome-right">
          <button type="button" id="btnPreview" class="icon-btn" title="Toggle preview (⌘⇧P)" aria-label="Toggle markdown preview" aria-pressed="false">◈</button>
          <button type="button" id="btnMono" class="icon-btn" title="Monospace" aria-label="Toggle monospace font" aria-pressed="false">{}</button>
          <button type="button" id="btnPin" class="icon-btn" title="Pin always-on-top" aria-label="Pin always on top" aria-pressed="true">📌</button>
          <button type="button" id="btnGhost" class="icon-btn" title="Click-through" aria-label="Toggle click-through" aria-pressed="false">👻</button>
          <div class="color-wrap">
            <button type="button" id="btnColor" class="color-dot" title="Color" aria-label="Choose note color" aria-haspopup="listbox" aria-expanded="false" aria-controls="palette"></button>
            <div id="palette" class="palette hidden" role="listbox"></div>
          </div>
          <label class="slider-wrap" title="Opacity">
            <input id="opacity" type="range" min="25" max="100" value="88" aria-label="Opacity" />
          </label>
          <label class="slider-wrap" title="Font size">
            <input id="fontSize" type="range" min="10" max="28" value="14" aria-label="Font size" />
          </label>
          <button type="button" id="btnNew" class="icon-btn" title="New note" aria-label="Create new note">＋</button>
          <button type="button" id="btnHide" class="icon-btn danger" title="Hide note" aria-label="Hide note">✕</button>
        </div>
      </header>

      <div id="mdToolbar" class="md-toolbar" aria-label="Markdown toolbar">
        <button type="button" data-md="h2" title="Heading" aria-label="Heading">H</button>
        <button type="button" data-md="bold" title="Bold" aria-label="Bold"><strong>B</strong></button>
        <button type="button" data-md="italic" title="Italic" aria-label="Italic"><em>I</em></button>
        <button type="button" data-md="strike" title="Strikethrough" aria-label="Strikethrough"><s>S</s></button>
        <button type="button" data-md="code" title="Inline code" aria-label="Inline code">&lt;/&gt;</button>
        <button type="button" data-md="link" title="Link" aria-label="Insert link">🔗</button>
        <span class="md-sep"></span>
        <button type="button" data-md="ul" title="Bullet list" aria-label="Bullet list">•≡</button>
        <button type="button" data-md="ol" title="Numbered list" aria-label="Numbered list">1.</button>
        <button type="button" data-md="task" title="Checklist" aria-label="Checklist">☑</button>
        <button type="button" data-md="quote" title="Quote" aria-label="Quote">❝</button>
        <button type="button" data-md="hr" title="Divider" aria-label="Divider">―</button>
      </div>

      <main class="body">
        <textarea
          id="editor"
          class="editor"
          spellcheck="true"
          placeholder="Write in Markdown…"
          aria-label="Note content"
        ></textarea>
        <div id="preview" class="preview hidden" aria-live="polite" role="article" aria-label="Markdown preview"></div>
      </main>

      <footer class="status">
        <div class="tags-row">
          <div id="tagChips" class="tag-chips"></div>
          <input
            id="tagInput"
            class="tag-input"
            type="text"
            maxlength="32"
            placeholder="+ tag"
            spellcheck="false"
            aria-label="Add tag"
          />
        </div>
        <span id="modeLabel" class="mode-label">edit</span>
      </footer>
    </div>
    <script src="markdown.js"></script>
    <script src="save-queue.js"></script>
    <script src="note.js"></script>
  </body>
</html>
