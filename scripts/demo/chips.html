<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Paint chips</title>
    <style>
      @font-face {
        font-family: 'Inter Variable';
        src: url('../../renderer/fonts/InterVariable.woff2') format('woff2');
        font-weight: 100 900;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #ffffff;
        font: 13px/1.3 'Inter Variable', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .row {
        box-sizing: border-box;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        height: 100%;
        padding: 14px;
      }
      .chip {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-radius: 8px;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.08);
      }
      .chip i {
        flex: 1;
      }
      .chip b {
        padding: 8px 10px 0;
        color: #1d1b18;
        font-weight: 600;
      }
      .chip span {
        padding: 2px 10px 9px;
        color: #74716b;
        font-size: 11.5px;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="chip"><i style="background: #a9b8a0"></i><b>Sage</b><span>#A9B8A0</span></div>
      <div class="chip"><i style="background: #e3d7c3"></i><b>Oat</b><span>#E3D7C3</span></div>
      <div class="chip"><i style="background: #c48a6a"></i><b>Clay</b><span>#C48A6A</span></div>
    </div>
  </body>
</html>
