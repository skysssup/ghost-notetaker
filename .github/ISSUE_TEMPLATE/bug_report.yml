name: Bug report
description: Report a problem with Ghost Notetaker
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Security issues should go through [SECURITY.md](../SECURITY.md), not this form.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, short description of what went wrong.
      placeholder: Closing a note deleted it instead of hiding it…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that reliably trigger the issue.
      placeholder: |
        1. Start the app with `npm start`
        2. Create a note
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Both / unsure
        - Other
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. macOS 15.1, Windows 11 23H2
  - type: input
    id: app-version
    attributes:
      label: App version / commit
      placeholder: e.g. 0.1.0 or git SHA
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant terminal output or attach screenshots (avoid personal note content).
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: I can reproduce this on a clean install / fresh userData (if applicable)
          required: false
