<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sample chart</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #ffffff;
        color: #23272e;
        font: 13px/1.4 'Noto Sans', 'Segoe UI', system-ui, sans-serif;
      }
      .card {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 18px 22px 14px;
        border: 1px solid #dfe3e8;
      }
      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }
      p {
        margin: 2px 0 0;
        color: #6b7280;
        font-size: 12px;
      }
      svg {
        display: block;
        flex: 1;
        width: 100%;
        min-height: 0;
        margin-top: 12px;
      }
      .bar {
        fill: #2f7d78;
      }
      .bar.last {
        fill: #1f5d59;
      }
      .grid {
        stroke: #e8ebef;
        stroke-width: 1;
      }
      .label,
      .value {
        fill: #6b7280;
        font-size: 11px;
        text-anchor: middle;
      }
      .value {
        fill: #23272e;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Weekly active crews</h1>
      <p>Kestrel beta · weeks 33–40 · sample data</p>
      <svg id="chart" aria-hidden="true"></svg>
    </div>
    <script>
      const values = [12, 14, 15, 19, 22, 27, 31, 36];
      const svg = document.getElementById('chart');
      const { width, height } = svg.getBoundingClientRect();
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      const ns = 'http://www.w3.org/2000/svg';
      const add = (tag, attrs, text) => {
        const node = document.createElementNS(ns, tag);
        for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
        if (text != null) node.textContent = text;
        svg.appendChild(node);
      };
      const chartTop = 18;
      const base = height - 24;
      for (const y of [0, 10, 20, 30, 40]) {
        const py = base - ((base - chartTop) * y) / 40;
        add('line', { class: 'grid', x1: 0, x2: width, y1: py, y2: py });
      }
      const slot = width / values.length;
      values.forEach((v, i) => {
        const h = ((base - chartTop) * v) / 40;
        const x = i * slot + slot * 0.2;
        add('rect', { class: `bar${i === values.length - 1 ? ' last' : ''}`, x, y: base - h, width: slot * 0.6, height: h, rx: 2 });
        add('text', { class: 'value', x: x + slot * 0.3, y: base - h - 6 }, String(v));
        add('text', { class: 'label', x: x + slot * 0.3, y: base + 18 }, `W${33 + i}`);
      });
    </script>
  </body>
</html>
