<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghost Notetaker — Notes Manager</title>
    <link rel="stylesheet" href="manager.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <span class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M5 21V10a7 7 0 0 1 14 0v11l-2.3-1.8L14.3 21 12 19.2 9.7 21l-2.4-1.8L5 21Z" /><circle cx="9.5" cy="10" r="1.3" fill="#2a1b5e" /><circle cx="14.5" cy="10" r="1.3" fill="#2a1b5e" /></svg>
          </span>
          <div>
            <div class="brand-name">Ghost Notetaker</div>
            <div class="brand-sub">Notes Manager</div>
          </div>
        </div>

        <div class="side-scroll">
          <section class="side-section" aria-labelledby="wsHeading">
            <div class="side-header">
              <h2 id="wsHeading">Workspaces</h2>
              <button type="button" id="btnNewWs" class="mini-btn" title="New workspace" aria-label="New workspace">+</button>
            </div>
            <ul id="wsList" class="side-list"></ul>
          </section>

          <section class="side-section" aria-labelledby="tagHeading">
            <div class="side-header"><h2 id="tagHeading">Tags</h2></div>
            <ul id="tagList" class="side-list"></ul>
          </section>

          <section class="side-section" aria-labelledby="recentHeading">
            <div class="side-header"><h2 id="recentHeading">Recent</h2></div>
            <ul id="recentList" class="side-list"></ul>
          </section>
        </div>

        <div class="side-footer">
          <button type="button" id="btnSettings" class="text-btn">Preferences</button>
          <button type="button" id="btnShortcuts" class="text-btn">Keyboard shortcuts</button>
          <button type="button" id="btnExport" class="text-btn">Export all notes…</button>
          <button type="button" id="btnImport" class="text-btn">Import backup…</button>
        </div>
      </aside>

      <main class="main">
        <div id="saveBanner" class="save-banner" role="alert" hidden></div>
        <header class="toolbar">
          <div class="search-wrap">
            <input id="search" type="search" placeholder="Search titles, text, and tags" aria-label="Search notes" autofocus />
          </div>
          <div class="toolbar-actions">
            <select id="visibilityFilter" title="Show" aria-label="Filter by visibility">
              <option value="all">All notes</option>
              <option value="open">Open</option>
              <option value="hidden">Hidden</option>
            </select>
            <select id="sortBy" title="Sort" aria-label="Sort notes">
              <option value="updated">Last edited</option>
              <option value="created">Created</option>
              <option value="title">Title</option>
              <option value="color">Color</option>
            </select>
            <select id="templateSelect" title="Template for new note" aria-label="Template for new note">
              <option value="blank">Blank note</option>
            </select>
            <button type="button" id="btnNewNote" class="primary-btn">New note</button>
          </div>
        </header>

        <div class="bulk-bar">
          <label class="bulk-check">
            <input type="checkbox" id="selectAll" />
            <span>Select all</span>
          </label>
          <div class="bulk-actions">
            <span id="selCount" class="sel-count" aria-live="polite"></span>
            <button type="button" id="btnBulkShow" class="ghost-btn" disabled>Show selected</button>
            <button type="button" id="btnBulkHide" class="ghost-btn" disabled>Hide selected</button>
          </div>
        </div>

        <div id="noteList" class="note-list" role="list" aria-label="Notes"></div>
        <div id="empty" class="empty hidden" role="status">
          <h2 id="emptyTitle">No notes here yet</h2>
          <p id="emptyText">Create a note or pick a template to get started.</p>
          <button type="button" id="btnEmptyNew" class="primary-btn">New note</button>
        </div>
      </main>
    </div>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-card" id="modalCard">
        <header class="modal-head">
          <h2 id="modalTitle">Dialog</h2>
          <button type="button" id="modalClose" class="icon-btn" aria-label="Close dialog">✕</button>
        </header>
        <div id="modalBody" class="modal-body"></div>
        <footer id="modalFooter" class="modal-footer"></footer>
      </div>
    </div>

    <script src="manager.js"></script>
  </body>
</html>
