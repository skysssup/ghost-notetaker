name: Feature request
description: Suggest an improvement for Ghost Notetaker
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Feature ideas are welcome. Please note that interview-AI / screen-capture “cheating” features are **out of scope**.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? Who benefits?
      placeholder: I often need to…
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should Ghost Notetaker behave?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about (optional).
  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - Notes / windows
        - Notes Manager
        - Workspaces / tags
        - Markdown / templates
        - Shortcuts / tray
        - Packaging / installers
        - Docs / DX
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: This does not request interview-AI, live screen/audio capture pipelines, or cheating tooling
          required: true
        - label: I searched existing issues / discussions for similar requests
          required: true
