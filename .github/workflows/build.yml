name: Build and test

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            artifact: dist-linux-x64
          - name: Windows x64
            os: windows-2025
            artifact: dist-windows-x64
          - name: macOS arm64
            os: macos-15
            arch: arm64
            artifact: dist-macos-arm64
          - name: macOS x64
            os: macos-15-intel
            arch: x64
            artifact: dist-macos-x64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Linux desktop test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox xdotool libfuse2t64
          # Ubuntu 24.04 restricts the user namespaces Electron's sandbox needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: End-to-end tests (Linux, X11)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" bash -c 'openbox & sleep 1 && npm run test:e2e'

      - name: End-to-end tests
        if: runner.os != 'Linux'
        run: npm run test:e2e

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: npm run dist:linux

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: npm run dist:win

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never

      - name: Smoke-test packaged app (Linux AppImage and .deb)
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node scripts/smoke-packaged.js dist/*.AppImage
          sudo apt-get install -y ./dist/*.deb
          grep -q -- '--ozone-platform=x11' /usr/share/applications/ghost-notetaker.desktop
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node scripts/smoke-packaged.js /usr/bin/ghost-notetaker
          sudo apt-get remove -y ghost-notetaker

      - name: Smoke-test packaged app (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP 'GhostNotetaker'
          Start-Process -Wait -FilePath $installer.FullName -ArgumentList '/S', "/D=$target"
          $exe = Join-Path $target 'Ghost Notetaker.exe'
          node scripts/smoke-packaged.js $exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Start-Process -Wait -FilePath (Join-Path $target 'Uninstall Ghost Notetaker.exe') -ArgumentList '/S'
          for ($i = 0; $i -lt 30 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw 'The uninstaller left the app behind' }

      - name: Smoke-test packaged app (macOS dmg and zip)
        if: runner.os == 'macOS'
        run: |
          app_dir=$([ "${{ matrix.arch }}" = arm64 ] && echo dist/mac-arm64 || echo dist/mac)
          codesign --verify --deep --strict --verbose=2 "$app_dir/Ghost Notetaker.app"
          hdiutil attach dist/*.dmg -nobrowse -readonly -mountpoint /Volumes/GhostNotetaker
          node scripts/smoke-packaged.js "/Volumes/GhostNotetaker/Ghost Notetaker.app/Contents/MacOS/Ghost Notetaker"
          hdiutil detach /Volumes/GhostNotetaker
          mkdir -p "$RUNNER_TEMP/zip-app"
          ditto -x -k dist/*.zip "$RUNNER_TEMP/zip-app"
          codesign --verify --deep --strict "$RUNNER_TEMP/zip-app/Ghost Notetaker.app"
          node scripts/smoke-packaged.js "$RUNNER_TEMP/zip-app/Ghost Notetaker.app/Contents/MacOS/Ghost Notetaker"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*-setup.exe
            dist/*.dmg
            dist/*.zip

  release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches package version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="## [${GITHUB_REF_NAME#v}]" 'index($0, v) == 1 { f = 1; next } /^## \[/ { f = 0 } f' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" release/*
          --draft --verify-tag
          --title "Ghost Notetaker ${GITHUB_REF_NAME#v}"
          --notes-file release-notes.md
