<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Desktop</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      .card {
        position: absolute;
        border-radius: 14px;
        box-shadow:
          0 0 0 0.5px rgba(20, 24, 22, 0.28),
          0 2px 8px rgba(20, 24, 22, 0.1),
          0 34px 80px -20px rgba(20, 32, 27, 0.55);
      }
      .card img {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: inherit;
      }
      .mask {
        background: #000;
      }
      .mask .card {
        inset: 0;
        background: #fff;
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <!--
      The desktop under the README screenshots and videos: the wallpaper and, optionally, a window
      as a card. Configured by the URL hash, a JSON object:
        { "card": { "x", "y", "width", "height", "image"? } }  a card at that place, with a screenshot
                                                              of the window or, without one, only its shadow
        { "mask": true }                                      a white card on black, to round a video's corners
    -->
    <script>
      const options = JSON.parse(decodeURIComponent(location.hash.slice(1)) || '{}');
      const card = document.createElement('div');
      card.className = 'card';
      if (options.mask) {
        document.body.className = 'mask';
      } else {
        const wall = document.createElement('iframe');
        wall.src = 'wallpaper.html';
        document.body.append(wall);
      }
      if (options.mask || options.card) document.body.append(card);
      if (options.card) {
        const { x, y, width, height, image } = options.card;
        Object.assign(card.style, { left: `${x}px`, top: `${y}px`, width: `${width}px`, height: `${height}px` });
        if (image) card.append(Object.assign(document.createElement('img'), { src: new URL(`file://${image}`).href, alt: '' }));
      }
    </script>
  </body>
</html>
