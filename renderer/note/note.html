<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: ghost-image:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghost Note</title>
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="note.css" />
  </head>
  <body>
    <!-- Icons: Lucide 1.51.0 (ISC, see ../shared/LUCIDE-LICENSE.txt); i-ghost and i-eye-on are drawn for this app. -->
    <svg class="icon-defs" aria-hidden="true">
      <defs>
        <symbol id="i-grip-vertical" viewBox="0 0 24 24"><circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/></symbol>
        <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></symbol>
        <symbol id="i-eye-on" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0ZM15 12a3 3 0 1 0-6 0 3 3 0 0 0 6 0Z"/></symbol>
        <symbol id="i-ghost" viewBox="0 0 24 24"><path d="M5 20.5V10a7 7 0 0 1 14 0v10.5l-2.33-1.75-2.34 1.75L12 18.75l-2.33 1.75-2.34-1.75Z"/><path d="M9.5 10h.01"/><path d="M14.5 10h.01"/></symbol>
        <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
        <symbol id="i-ellipsis" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
        <symbol id="i-heading-2" viewBox="0 0 24 24"><path d="M4 12h8"/><path d="M4 18V6"/><path d="M12 18V6"/><path d="M21 18h-4c0-4 4-3 4-6 0-1.5-2-2.5-4-1"/></symbol>
        <symbol id="i-bold" viewBox="0 0 24 24"><path d="M6 12h9a4 4 0 0 1 0 8H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h7a4 4 0 0 1 0 8"/></symbol>
        <symbol id="i-italic" viewBox="0 0 24 24"><line x1="19" x2="10" y1="4" y2="4"/><line x1="14" x2="5" y1="20" y2="20"/><line x1="15" x2="9" y1="4" y2="20"/></symbol>
        <symbol id="i-strikethrough" viewBox="0 0 24 24"><path d="M16 4H9a3 3 0 0 0-2.83 4"/><path d="M14 12a4 4 0 0 1 0 8H6"/><line x1="4" x2="20" y1="12" y2="12"/></symbol>
        <symbol id="i-code" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></symbol>
        <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>
        <symbol id="i-list" viewBox="0 0 24 24"><path d="M3 5h.01"/><path d="M3 12h.01"/><path d="M3 19h.01"/><path d="M8 5h13"/><path d="M8 12h13"/><path d="M8 19h13"/></symbol>
        <symbol id="i-list-ordered" viewBox="0 0 24 24"><path d="M11 5h10"/><path d="M11 12h10"/><path d="M11 19h10"/><path d="M4 4h1v5"/><path d="M4 9h2"/><path d="M6.5 20H3.4c0-1 2.6-1.925 2.6-3.5a1.5 1.5 0 0 0-2.6-1.02"/></symbol>
        <symbol id="i-square-check" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m16 9-5.5 5.5L8 12"/></symbol>
        <symbol id="i-text-quote" viewBox="0 0 24 24"><path d="M17 5H3"/><path d="M21 12H8"/><path d="M21 19H8"/><path d="M3 12v7"/></symbol>
        <symbol id="i-table" viewBox="0 0 24 24"><path d="M12 3v18"/><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
      </defs>
    </svg>

    <button type="button" id="bubble" class="bubble" hidden aria-label="Expand note">
      <span id="bubbleInitial" class="bubble-initial" aria-hidden="true"></span>
    </button>

    <div id="shell" class="shell">
      <header id="chrome" class="chrome" aria-label="Note controls">
        <span class="grip" title="Drag to move" aria-hidden="true"><svg class="ico"><use href="#i-grip-vertical" /></svg></span>
        <input
          id="title"
          class="title-input"
          type="text"
          maxlength="200"
          placeholder="Title"
          spellcheck="false"
          aria-label="Note title"
        />
        <span class="drag-spacer" aria-hidden="true"></span>
        <div class="chrome-buttons">
          <button type="button" id="btnPreview" class="icon-btn" title="Reading mode" aria-label="Reading mode" aria-pressed="false">
            <svg class="ico when-off"><use href="#i-eye" /></svg><svg class="ico when-on"><use href="#i-eye-on" /></svg>
          </button>
          <button type="button" id="btnGhost" class="icon-btn" title="Click-through" aria-label="Click-through" aria-pressed="false"><svg class="ico glyph"><use href="#i-ghost" /></svg></button>
          <button type="button" id="btnCollapse" class="icon-btn" title="Collapse to a bubble" aria-label="Collapse to a bubble"><svg class="ico"><use href="#i-minus" /></svg></button>
          <button type="button" id="btnMore" class="icon-btn" title="Appearance and more" aria-label="Appearance and more" aria-haspopup="true" aria-expanded="false" aria-controls="morePanel"><svg class="ico"><use href="#i-ellipsis" /></svg></button>
          <button type="button" id="btnHide" class="icon-btn close" title="Hide note" aria-label="Hide note"><svg class="ico"><use href="#i-x" /></svg></button>
        </div>
        <div id="morePanel" class="more-panel hidden" role="group" aria-label="Note appearance">
          <div class="panel-section">
            <div class="panel-label" id="paletteLabel">Paper</div>
            <div id="palette" class="palette" role="radiogroup" aria-labelledby="paletteLabel"></div>
          </div>
          <div class="panel-section">
            <label class="panel-row" for="opacity">
              <span>Opacity</span>
              <input id="opacity" type="range" min="25" max="100" value="100" />
              <output id="opacityValue" for="opacity">100%</output>
            </label>
            <label class="panel-row" for="fontSize">
              <span>Text size</span>
              <input id="fontSize" type="range" min="10" max="28" value="14" />
              <output id="fontSizeValue" for="fontSize">14px</output>
            </label>
          </div>
          <div class="panel-section">
            <button type="button" id="btnPin" class="toggle-row" role="switch" aria-checked="true"><span>Keep on top</span><span class="switch" aria-hidden="true"></span></button>
            <button type="button" id="btnMono" class="toggle-row" role="switch" aria-checked="false"><span>Monospace</span><span class="switch" aria-hidden="true"></span></button>
          </div>
          <div class="panel-section">
            <button type="button" id="btnNew" class="text-btn">New note</button>
          </div>
        </div>
      </header>

      <div id="mdToolbar" class="md-toolbar" aria-label="Markdown toolbar">
        <div class="md-group">
          <button type="button" data-md="h2" title="Heading" aria-label="Heading"><svg class="ico"><use href="#i-heading-2" /></svg></button>
          <button type="button" data-md="bold" title="Bold (Ctrl/Cmd+B)" aria-label="Bold"><svg class="ico"><use href="#i-bold" /></svg></button>
          <button type="button" data-md="italic" title="Italic (Ctrl/Cmd+I)" aria-label="Italic"><svg class="ico"><use href="#i-italic" /></svg></button>
          <button type="button" data-md="strike" title="Strikethrough" aria-label="Strikethrough"><svg class="ico"><use href="#i-strikethrough" /></svg></button>
          <button type="button" data-md="code" title="Inline code" aria-label="Inline code"><svg class="ico"><use href="#i-code" /></svg></button>
          <button type="button" data-md="link" title="Link (Ctrl/Cmd+K)" aria-label="Insert link"><svg class="ico"><use href="#i-link" /></svg></button>
        </div>
        <span class="md-sep" aria-hidden="true"></span>
        <div class="md-group md-more">
          <button type="button" data-md="ul" title="Bullet list" aria-label="Bullet list"><svg class="ico"><use href="#i-list" /></svg></button>
          <button type="button" data-md="ol" title="Numbered list" aria-label="Numbered list"><svg class="ico"><use href="#i-list-ordered" /></svg></button>
          <button type="button" data-md="task" title="Checklist" aria-label="Checklist"><svg class="ico"><use href="#i-square-check" /></svg></button>
          <button type="button" data-md="quote" title="Quote" aria-label="Quote"><svg class="ico"><use href="#i-text-quote" /></svg></button>
          <button type="button" data-md="table" title="Table" aria-label="Insert table"><svg class="ico"><use href="#i-table" /></svg></button>
          <button type="button" data-md="hr" title="Divider" aria-label="Divider"><svg class="ico"><use href="#i-minus" /></svg></button>
        </div>
        <button type="button" id="btnMdMore" class="md-overflow" title="More formatting" aria-label="More formatting" aria-expanded="false"><svg class="ico"><use href="#i-ellipsis" /></svg></button>
      </div>

      <main class="body">
        <textarea
          id="editor"
          class="editor"
          spellcheck="true"
          placeholder="Write in Markdown. Paste or drop an image to add it."
          aria-label="Note content"
        ></textarea>
        <div id="preview" class="preview hidden" aria-live="polite" role="article" aria-label="Formatted note" tabindex="0"></div>
      </main>

      <footer class="status">
        <div id="tagChips" class="tags"></div>
        <label class="tag-add" title="Add a tag">
          <svg class="ico"><use href="#i-plus" /></svg>
          <input
            id="tagInput"
            class="tag-input"
            type="text"
            maxlength="32"
            placeholder="tag"
            spellcheck="false"
            aria-label="Add tag"
          />
        </label>
        <span id="saveStatus" class="save-status" role="status" hidden></span>
      </footer>
    </div>
    <script src="markdown.js"></script>
    <script src="save-queue.js"></script>
    <script src="note.js"></script>
  </body>
</html>
